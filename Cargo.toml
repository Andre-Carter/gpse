[package]
name = "gpse"
version = "0.1.0"
edition = "2024"
description = "general purpose simulation engine"
authors = ["Andre Carter"]
license = ""
repository = "https://github.com/Andre-Carter/gpse"

[dependencies]
db = { version = "0.1.0", path = "db" }
pigeon = { version = "0.1.0", path = "pigeon" }
rust_rust = { version = "0.1.0", path = "rust_rust" }
rand = { version = "0.10.3", optional = true }

[workspace]
resolver = "3"
members = [
    "db",
    "pigeon",
    "rust_rust",
]



# temp placeholder till optional dependencies gets green
#rand = "0.10.3"

# Optional dependancies for specialized programs



# Features configuration

[features]
default = []

# Enables the Marvel Rivals random hero program

marvel-rivals = ["dep:rand"]
